name: repository-safety-check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile repository checks
        run: >-
          python -m py_compile
          scripts/preflight_repository.py
          scripts/check_governance_consistency.py
          scripts/prepare_repository.py
          scripts/validate_v1_0_1_maintenance.py
          scripts/validate_v1_0_2_maintenance.py

      - name: Check repository safety
        run: python scripts/preflight_repository.py .

      - name: Check governance consistency
        run: python scripts/check_governance_consistency.py .

      - name: Check V1.0.1 maintenance baseline
        run: python scripts/validate_v1_0_1_maintenance.py --project-root .

      - name: Check V1.0.2 maintenance package
        run: python scripts/validate_v1_0_2_maintenance.py --project-root .

      - name: Check public snapshot builder
        run: python scripts/prepare_repository.py --project-root . --output "${{ runner.temp }}/agelens-v1-public"
